[project]
name = "prioritask"
version = "0.2.0-alpha"
requires-python = ">=3.11,<4.0"

dependencies = [
  # ─── API ──────────────────────────────────────────────────────────────
  "fastapi>=0.115.0",
  "uvicorn[standard]~=0.30",

  # ─── ORM / BDs ────────────────────────────────────────────────────────
  "sqlmodel~=0.0.24",
  "aiosqlite~=0.21",          # driver async para SQLite
  "sqlalchemy[asyncio]>=2.0", # incluye greenlet (SQLAlchemy 2.1 ya no lo instala por defecto)

  # ─── Configuración & Seguridad ───────────────────────────────────────
  "pydantic-settings~=2.1",
  "python-jose[cryptography]>=3.3.0",   # JWT
  "rsa>=4.9",
  "passlib[bcrypt]==1.7.*",           # hashing de contraseñas
  "bcrypt==4.0.1",

  # ─── IA / Background Jobs ────────────────────────────────────────────
  "httpx>=0.27.0",
  "celery[redis]~=5.4",


  # ─── Miscelánea ────────────────────────────────────────────────────────
  "python-dotenv~=1.0",
  "filetype>=1.2.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov~=5.0",
  "coverage~=7.5",
  "httpx~=0.27",
  "alembic~=1.13",
  "ruff",
  "email-validator",
  "pytest-asyncio"
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.coverage.report]
fail_under = 70
omit = [
    "app/services/intelligence.py",
    "app/schemas/response_examples.py",
    "demo_bad_code.py",
    "tests/*"
]

[tool.poetry]
package-mode = false

[tool.setuptools]
packages = ["app"]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

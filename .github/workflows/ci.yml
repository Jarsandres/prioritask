name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-secret-key-for-testing-only-123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e .[dev]

      - name: Security audit dependencies
        run: |
          pip install pip-audit && pip-audit --desc on --skip-editable --ignore-vuln CVE-2024-33663 --ignore-vuln CVE-2024-33664 --ignore-vuln GHSA-4822-4948-433r --ignore-vuln GHSA-8cf7-32gw-wr33 --ignore-vuln PYSEC-2024-40 --ignore-vuln PYSEC-2024-41 --ignore-vuln CVE-2024-23342 --ignore-vuln GHSA-wj6h-64fc-37mp --ignore-vuln PYSEC-2024-47

      - name: Lint
        run: |
          ruff check app/ tests/

      - name: Tests
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prioritask-frontend/package-lock.json

      - name: Install dependencies
        working-directory: prioritask-frontend
        run: |
          npm ci || npm install

      - name: Security audit dependencies
        working-directory: prioritask-frontend
        run: |
          npm audit --audit-level=high

      - name: Lint
        working-directory: prioritask-frontend
        run: |
          npm run lint

      - name: Run unit tests
        working-directory: prioritask-frontend
        run: |
          npm run test:unit

      - name: Build
        working-directory: prioritask-frontend
        run: |
          npm run build

  e2e-ci:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-secret-key-for-testing-only-123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -e .[dev]

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prioritask-frontend/package-lock.json

      - name: Install dependencies
        working-directory: prioritask-frontend
        run: |
          npm ci || npm install

      - name: Cache Playwright Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('prioritask-frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: prioritask-frontend
        run: |
          npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: prioritask-frontend
        run: |
          npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: prioritask-frontend
        run: |
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: prioritask-frontend/playwright-report/
          retention-days: 7

